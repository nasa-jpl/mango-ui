on:
  push:
    tags:
      - "*"
    branches:
      - develop
      - main
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: "mango_ui"

jobs:
  test_mango_ui:
    name: Test MANGO UI
    environment: mango_ui
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
        shell: bash

      - name: Import certificates and keys
        run: |
          mkdir -p .cert
          echo "${{ secrets.KEY }}" > .cert/key.pem
          echo "${{ secrets.CERTIFICATE }}" > .cert/cert.pem
          chmod 600 .cert/key.pem .cert/cert.pem
        shell: bash

      - name: Build application
        run: |
          npm run build
          ls dist/assets
        env:
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE}}
          VITE_APP_PATH: ${{ vars.VITE_APP_PATH}}
        shell: bash

      - name: Run lint
        run: |
          npm run lint
          npm run lint:css
        shell: bash

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Run mutation tests
        run: npm run test:mutation

      # Diffable before/after metrics on every PR (§Phase-5.3 / §7). Runs even when a
      # gate above fails so the numbers are always visible. Reporting only — the gates
      # are the vitest coverage thresholds and the Stryker `break` threshold.
      - name: Publish metrics summary
        if: ${{ !cancelled() }}
        run: node scripts/metrics-summary.mjs

      - name: Run e2e tests
        run: npx playwright test --project=chromium
        env:
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE}}
          VITE_APP_PATH: ${{ vars.VITE_APP_PATH}}

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results
          path: e2e-test-results/
          retention-days: 2 # limit imposed by GitHub organization

      # Upload metrics artifacts on every run for before/after diffing (TESTING_STRATEGY.md
      # §7). No thresholds/gating here yet — that is Phase 5.
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: test-metrics/coverage/
          retention-days: 2 # limit imposed by GitHub organization

      - name: Upload mutation report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: test-metrics/mutation/
          retention-days: 2 # limit imposed by GitHub organization

  build_image:
    name: Build Image
    environment: mango_ui
    runs-on: ubuntu-24.04
    needs: [test_mango_ui]
    if: |
      needs.test_mango_ui.result == 'success' &&
      (
        github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/tags/')
      )
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v5

      - name: Inject certificates and keys
        run: |
          mkdir -p .cert
          echo "${{ secrets.KEY }}" > .cert/key.pem
          echo "${{ secrets.CERTIFICATE }}" > .cert/cert.pem
          chmod 600 .cert/key.pem .cert/cert.pem
        shell: bash

      - name: Create env variable of lowercase GitHub repo name
        run: |
          GITHUB_REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "GITHUB_REPO_LOWER=$GITHUB_REPO_LOWER" >>${GITHUB_ENV}
        shell: bash

      - name: Set image tag environment variable
        run: |
          GITHUB_REF_NAME_CLEAN="${GITHUB_REF_NAME//\//_}"
          echo "GITHUB_REF_NAME_CLEAN=$GITHUB_REF_NAME_CLEAN" >>${GITHUB_ENV}

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.GITHUB_REPO_LOWER }}
          tags: ${{ env.GITHUB_REF_NAME_CLEAN }}
          containerfiles: |
            ./Containerfile
          build-args: |
            VITE_APP_RELEASE=${{ env.GITHUB_REF_NAME_CLEAN }}
            VITE_GIT_COMMIT_HASH=${{ github.sha }}

      - name: Push to GitHub Container Registry
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
